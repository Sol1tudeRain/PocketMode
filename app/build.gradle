plugins { id 'com.android.application' }
android {
    namespace 'org.pocketguard.lsp'
    compileSdk 35
    defaultConfig {
        applicationId 'org.pocketguard.lsp'
        minSdk 29
        targetSdk 35
        versionCode 12
        versionName '1.2-crdroid-a17-touch-corrected'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}

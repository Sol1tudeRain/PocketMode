plugins { id 'com.android.application' }
android {
    namespace 'org.pocketguard.lsp'
    compileSdk 35
    defaultConfig {
        applicationId 'org.pocketguard.lsp'
        minSdk 29
        targetSdk 32
        versionCode 7
        versionName '0.7-touch-proximity-fixed-signing'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}

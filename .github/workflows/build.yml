name: Build PocketMode APK
on:
  push:
    branches: [main, experimental/crdroid-framework-port]
  pull_request:
    branches: [main, experimental/crdroid-framework-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug and unsigned release
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease
      - name: Validate and align unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          DBG=app/build/outputs/apk/debug/app-debug.apk
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$DBG"
          test -s "$UNSIGNED"
          unzip -t "$DBG"
          unzip -t "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$DBG"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" app/build/outputs/apk/release/PocketMode-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 app/build/outputs/apk/release/PocketMode-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/PocketMode-aligned-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" app/build/outputs/apk/release/apksigner.jar
          test -s app/build/outputs/apk/release/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: PocketMode-unsigned-for-private-signing
          path: |
            app/build/outputs/apk/release/PocketMode-aligned-unsigned.apk
            app/build/outputs/apk/release/apksigner.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PocketMode-debug-unstable-signature
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

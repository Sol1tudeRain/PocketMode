name: Build independent sensor diagnostic APK
on:
  push:
    branches: [experimental/crdroid-framework-port]
    paths:
      - 'sensorprobe/**'
      - 'settings.gradle'
      - '.github/workflows/sensor-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build independent debug APK
        run: gradle --no-daemon --stacktrace :sensorprobe:assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=sensorprobe/build/outputs/apk/debug/sensorprobe-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: SensorProbe-debug-APK
          path: sensorprobe/build/outputs/apk/debug/sensorprobe-debug.apk
          if-no-files-found: error
